name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # Core, CLI, adapters: standard library only (also what runs inside Maya).
    # Server tests skip themselves here because fastapi/uvicorn are not installed.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.11"]   # 3.9 = Maya 2023 Python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (stdlib unittest, no DCC required)
        run: python -m unittest discover -s tests -t . -v

  server:
    # Local Sync Server (Phase 1) with its pinned dependencies.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install server packages
        run: python -m pip install -r requirements-server.txt
      - name: Run all tests including the server
        run: python -m unittest discover -s tests -t . -v
